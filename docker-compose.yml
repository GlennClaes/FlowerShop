version: "3.9"

services:
  frontend:
    image: glennclaes123/flowershop-frontend:${IMAGE_TAG}
    container_name: flowershop_frontend
    restart: always
    networks:
      - flowershop_network

  nginx:
    image: nginx:latest
    container_name: flowershop_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
    networks:
      - flowershop_network

  certbot:
    image: certbot/certbot
    container_name: flowershop_certbot
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; 
                 while :; do sleep 12h & wait $${!}; 
                 certbot renew --webroot -w /var/www/certbot; 
                 done;"

networks:
  flowershop_network:
    driver: bridge